# Reverse proxy for Pinokio's own web UI.
#
# Pinokio's kernel (pinokiod) serves a full browser front end on
# 127.0.0.1:42000. Rather than streaming the whole X11 desktop, the bore
# tunnel points at this port: it is lighter, works on phones, and needs no
# GPU on the client.
#
# This server block sits behind the same HTTP basic auth as the desktop
# (.htpasswd, written by the base image from CUSTOM_USER / PASSWORD), because
# Pinokio's UI itself has no authentication of its own.
#
# Installed into /etc/nginx/conf.d by 10-pinokio-ui-proxy.sh, where the
# Selkies base image's nginx.conf picks it up.
server {
    auth_basic            "Pinokio";
    auth_basic_user_file  /etc/nginx/.htpasswd;

    listen      3002 default_server;
    listen      [::]:3002 default_server;

    # Pinokio uploads can be large (models, datasets).
    client_max_body_size 0;
    proxy_buffering          off;
    proxy_request_buffering  off;

    location / {
        proxy_set_header        Upgrade           $http_upgrade;
        proxy_set_header        Connection        "upgrade";
        proxy_set_header        Host              $host;
        proxy_set_header        X-Real-IP         $remote_addr;
        proxy_set_header        X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header        X-Forwarded-Proto $scheme;
        proxy_http_version      1.1;
        # Long-lived websockets and long-running installs (installs can take
        # minutes to hours, and the UI streams their output over a socket).
        proxy_read_timeout      3600s;
        proxy_send_timeout      3600s;
        proxy_connect_timeout   3600s;
        proxy_pass              http://127.0.0.1:42000;
    }
}
